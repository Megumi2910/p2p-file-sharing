name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven reactor gate
        run: mvn -B -ntp clean verify

      - name: Run ClientUpdateSmoke (Ubuntu)
        if: runner.os == 'Linux'
        run: xvfb-run -a java -Djava.awt.headless=false -cp "peer-app/target/peer-app.jar:tracker-server/target/tracker-server.jar:peer-app/target/test-classes" vn.edu.p2p.peer.ClientUpdateSmoke

      - name: Run ClientUpdateSmoke (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: java "-Djava.awt.headless=false" -cp "peer-app/target/peer-app.jar;tracker-server/target/tracker-server.jar;peer-app/target/test-classes" vn.edu.p2p.peer.ClientUpdateSmoke

      - name: Run DesktopUiSmoke (Ubuntu, scales 1, 1.25, 1.5, 2)
        if: runner.os == 'Linux'
        run: |
          for scale in 1 1.25 1.5 2; do
            echo "=== Running DesktopUiSmoke at scale $scale ==="
            xvfb-run -a -s "-screen 0 2560x1600x24" java -Djava.awt.headless=false -cp "peer-app/target/peer-app.jar:tracker-server/target/tracker-server.jar:peer-app/target/test-classes" vn.edu.p2p.peer.DesktopUiSmoke --scale $scale
          done

      - name: Run DesktopUiSmoke (Windows, scales 1, 1.25, 1.5, 2)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for scale in 1 1.25 1.5 2; do
            echo "=== Running DesktopUiSmoke at scale $scale ==="
            java "-Djava.awt.headless=false" -cp "peer-app/target/peer-app.jar;tracker-server/target/tracker-server.jar;peer-app/target/test-classes" vn.edu.p2p.peer.DesktopUiSmoke --scale $scale
          done
