    - heading "Understand the system before changing it." [level=1] [ref=e21]
    - paragraph [ref=e22]: This is a university-scale hybrid peer-to-peer file sharing application. A central tracker tells peers how to find one another; the peers then send file bytes directly over TCP. The central engineering pressure is keeping discovery separate from transfer while proving that every received byte belongs to the intended file.
