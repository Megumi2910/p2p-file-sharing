# P2P File Sharing - FlatLaf Custom Defaults

TitlePane.useWindowDecorations=false

defaultFont=16

# Geometry and component metrics
Component.arc=8
Button.arc=8
TextComponent.arc=8
ProgressBar.arc=6
Component.focusWidth=1

Table.rowHeight=36
Button.minimumHeight=36

# Semantic Palette Tokens
[light]P2P.canvas.background=#F4F6F8
[dark]P2P.canvas.background=#171D26

[light]P2P.surface.background=#FFFFFF
[dark]P2P.surface.background=#202936

[light]P2P.text.foreground=#15212F
[dark]P2P.text.foreground=#ECF1F7

[light]P2P.muted.foreground=#526174
[dark]P2P.muted.foreground=#A8B5C5

[light]P2P.borderColor=#CFD7E1
[dark]P2P.borderColor=#3B495B

[light]P2P.accent.foreground=#215DB0
[dark]P2P.accent.foreground=#8CB8FF

[light]P2P.onAccent.foreground=#FFFFFF
[dark]P2P.onAccent.foreground=#171D26

[light]P2P.selection.background=#DCE9FC
[dark]P2P.selection.background=#303F58

[light]P2P.success.foreground=#237A46
[dark]P2P.success.foreground=#77D69A

[light]P2P.warning.foreground=#835E12
[dark]P2P.warning.foreground=#E8BF64

[light]P2P.error.foreground=#B02B36
[dark]P2P.error.foreground=#FF9A9F

[light]P2P.pending.background=#DEE5ED
[dark]P2P.pending.background=#3B495B

# Standard Component Mappings
Panel.background=$P2P.canvas.background

Table.background=$P2P.surface.background
Table.foreground=$P2P.text.foreground
Table.selectionBackground=$P2P.selection.background
Table.selectionForeground=$P2P.text.foreground
Table.gridColor=$P2P.borderColor
TableHeader.background=$P2P.canvas.background
TableHeader.foreground=$P2P.muted.foreground

List.background=$P2P.surface.background
List.foreground=$P2P.text.foreground
List.selectionBackground=$P2P.selection.background
List.selectionForeground=$P2P.text.foreground

Viewport.background=$P2P.surface.background
ScrollPane.background=$P2P.surface.background

TextField.background=$P2P.surface.background
TextField.foreground=$P2P.text.foreground
TextArea.background=$P2P.surface.background
TextArea.foreground=$P2P.text.foreground

SplitPane.background=$P2P.canvas.background
ProgressBar.background=$P2P.pending.background
ProgressBar.foreground=$P2P.accent.foreground

# Primary button style class
[style].muted=foreground: $P2P.muted.foreground

[style]Button.primary=background: $P2P.accent.foreground; foreground: $P2P.onAccent.foreground; hoverBackground: lighten($P2P.accent.foreground,8%); pressedBackground: darken($P2P.accent.foreground,8%); focusedBackground: $P2P.accent.foreground; disabledBackground: $P2P.pending.background; disabledText: $P2P.muted.foreground; borderWidth: 0
